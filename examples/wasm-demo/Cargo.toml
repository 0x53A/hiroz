[workspace]

[package]
name = "hiroz-wasm-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hiroz = { path = "../../crates/hiroz", default-features = false, features = [
  "jazzy",
  "rmw-zenoh",
] }
hiroz-cdr = { path = "../../crates/hiroz-cdr" }
hiroz-protocol = { path = "../../crates/hiroz-protocol", default-features = false, features = [
  "std",
  "rmw-zenoh",
] }

zenoh = { path = "../../../zenoh-wasm/zenoh", default-features = false, features = [
  "transport_ws",
  "unstable",
] }
zenoh-ext = { path = "../../../zenoh-wasm/zenoh-ext", default-features = false }
zenoh-buffers = { path = "../../../zenoh-wasm/commons/zenoh-buffers" }

flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document",
  "DedicatedWorkerGlobalScope",
  "Element",
  "ErrorEvent",
  "HtmlElement",
  "MessageEvent",
  "Window",
  "Worker",
  "WorkerOptions",
  "WorkerType",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-web = "0.1"
byteorder = "1.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
futures-lite = "2"
