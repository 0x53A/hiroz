<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hiroz // browser ↔ ROS 2</title>
<style>
  :root { --bg:#101210; --panel:#181b18; --fg:#d8dcd8; --dim:#7a807a;
          --accent:#ff6a00; --ok:#4ade80; --err:#f87171; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--fg); font-family:monospace;
         margin:0; padding:2rem; }
  h1 { font-size:1.1rem; letter-spacing:.15em; text-transform:uppercase;
       border-left:6px solid var(--accent); padding-left:.6rem; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid #2a2e2a; padding:1rem;
           flex:1 1 24rem; }
  .panel h2 { font-size:.8rem; color:var(--dim); margin:0 0 .6rem 0;
              text-transform:uppercase; letter-spacing:.1em; }
  button { background:var(--accent); color:#000; border:0; padding:.5rem 1.2rem;
           font-family:inherit; font-weight:bold; cursor:pointer; }
  button:disabled { background:#3a3e3a; color:var(--dim); cursor:default; }
  input { background:#0c0e0c; color:var(--fg); border:1px solid #2a2e2a;
          padding:.5rem; font-family:inherit; width:60%; }
  #feed { height:18rem; overflow-y:auto; white-space:pre-wrap; font-size:.85rem; }
  #feed .in  { color:var(--ok); }
  #feed .out { color:var(--accent); }
  #status { color:var(--dim); }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--err); }
</style>
</head>
<body>
<h1>hiroz // browser &harr; ROS 2 (threaded WASM)</h1>
<p id="status">idle — click connect (needs zenoh router on ws://127.0.0.1:7448 + ROS 2 stack)</p>
<div class="row">
  <div class="panel">
    <h2>control</h2>
    <button id="connect">connect</button>
    <div style="margin-top:1rem">
      <input id="msg" placeholder="message for /chatter" value="Hello from the browser!">
      <button id="send" disabled>publish</button>
    </div>
  </div>
  <div class="panel">
    <h2>/chatter feed (std_msgs/String via rmw_zenoh)</h2>
    <div id="feed"></div>
  </div>
</div>
<script src="./pkg/hiroz_wasm_demo_threaded.js"></script>
<script>
const $ = id => document.getElementById(id);
const feed = line => {
  const div = document.createElement('div');
  div.className = line.startsWith('→') ? 'out' : 'in';
  div.textContent = line;
  $('feed').appendChild(div);
  $('feed').scrollTop = $('feed').scrollHeight;
};
const setStatus = (txt, cls) => { $('status').textContent = txt; $('status').className = cls || ''; };

(async () => {
  await wasm_bindgen('./pkg/hiroz_wasm_demo_threaded_bg.wasm');

  $('connect').onclick = () => {
    $('connect').disabled = true;
    if (!wasm_bindgen.ros_start('./pkg/hiroz_wasm_demo_threaded.js')) {
      setStatus('SharedArrayBuffer unavailable — serve with COOP/COEP headers', 'err');
      return;
    }
    setStatus('connecting…');
    wasm_bindgen.ros_connect('ws/127.0.0.1:7448');
    setInterval(() => {
      const st = wasm_bindgen.ros_poll_status();
      if (st === 'CONNECTED') { setStatus('connected — node wasm_threaded_browser live', 'ok'); $('send').disabled = false; }
      else if (st) setStatus(st, 'err');
      for (let i = 0; i < 32; i++) {
        const m = wasm_bindgen.ros_poll();
        if (m === null || m === undefined) break;
        feed('  ' + m);
      }
    }, 100);
  };

  $('send').onclick = () => {
    const text = $('msg').value;
    if (wasm_bindgen.ros_publish(text)) feed('→ ' + text);
    else setStatus('publish failed', 'err');
  };
})();
</script>
</body>
</html>
